<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario del Bar</title>
<meta name="theme-color" content="#b4561b">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mut:#77746b;--ac:#b4561b;--acx:#fff;--ok:#2f7d4f;--bad:#c0392b;--bd:#e4e0d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161512;--card:#211f1b;--tx:#f1eee6;--mut:#9a958a;--ac:#e08a4b;--acx:#1a1308;--ok:#5fb383;--bad:#ff7a6b;--bd:#35322b}}
:root[data-theme="dark"]{--bg:#161512;--card:#211f1b;--tx:#f1eee6;--mut:#9a958a;--ac:#e08a4b;--acx:#1a1308;--ok:#5fb383;--bad:#ff7a6b;--bd:#35322b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:18px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mut{color:var(--mut);font-size:13px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--acx);font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.r{background:var(--bad);color:#fff}
button:disabled{opacity:.5}
input,select{font:inherit;width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.chips button{white-space:nowrap;padding:7px 12px;font-size:14px}
.qty{min-width:44px;text-align:center;font-weight:700;font-size:20px}
.low .qty{color:var(--bad)}.low{border-color:var(--bad)}
.rb{width:44px;height:44px;padding:0;font-size:22px}
.alert{background:var(--bad);color:#fff;border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:transparent;color:var(--mut);border-radius:8px}.tabs button.on{color:var(--ac)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px auto;max-width:280px}.pad button{font-size:24px;padding:16px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.dots{display:flex;gap:14px;justify-content:center;margin:18px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ac)}.dots i.f{background:var(--ac)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.seg{display:flex;gap:8px;margin:10px 0}.seg button{flex:1}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;z-index:9;font-size:14px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.center{text-align:center;padding:30px 10px}
</style></head><body><div id="app"><div class="center mut">Cargando…</div></div>
<script>
const CATS=["Sin alcohol","Cervezas","Vinos","Licores","Snacks","Otros"];
const SEED={"Sin alcohol":["Acuarius Naranja","Acuarius Limón","Nestea Maracuyá","Nestea Limón","Coca-Cola","Coca-Cola 0","Coca-Cola 00","Fanta de limón","Fanta de naranja","Tónica Schweppes","Agua grande","Agua pequeña","Agua con gas","Batido de chocolate","Batido de fresa","Leche normal","Leche sin lactosa","Leche de soja","Zumo de melocotón","Zumo de piña","Energética Reffer","Energética Monster blanco","Energética Red Bull 0","Casera normal","Casera limón","Seven Up"],
"Cervezas":["Mahou","Mahou 00","Mahou 00 tostada","Mahou Reserva","Mahou Radler","Mahou sin filtrar","San Miguel 00","San Miguel Especial","San Miguel sin gluten","Alhambra verde","Corona 0","Corona","Budweiser","Barril San Miguel","Barril Estrella","Barril Tinto de verano"],
"Vinos":["Tinto","Vino blanco"],
"Licores":["Barceló","Brugal","Larios","Beefeater","Seagram's","Tanqueray 00","Vodka Absolut","Red Label","Black Label","DYC 8 años","DYC normal","Jameson","Bacardi","Ruavieja licor de hierbas","Ruavieja pacharán","Baileys"],
"Snacks":["Frutos secos","Aceitunas","Patatas Doritos","Patatas Ruffles","Patatas Santa Ana","Patatas Cheetos"],
"Otros":["Sal","Pimienta","Ketchup","Mayonesa","Mostaza","Bombonas de gas"]};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const today=()=>new Date().toLocaleDateString('sv');
const fd=d=>d?d.split('-').reverse().join('/'):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let db=null,S={users:[],products:[],logs:[],lu:0,lp:0,me:null,tab:'inv',cat:'Todos',q:'',low:false,sheet:null,pin:'',err:'',edit:false,seeding:''};
const isAdmin=()=>S.me&&S.me.role==='admin';
const isLow=p=>(p.min||0)>0&&(p.qty||0)<=p.min;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function resolveMe(){const id=st.get('inv_me');S.me=S.users.find(u=>u.id===id)||null}

window.boot=function(fb){
  db=fb;
  const er=e=>{S.err=e.message||'Error';render()};
  db.collection('users').onSnapshot(s=>{S.users=s.docs.map(d=>({id:d.id,...d.data()}));S.lu=1;resolveMe();render()},er);
  db.collection('products').onSnapshot(s=>{S.products=s.docs.map(d=>({id:d.id,...d.data()}));S.lp=1;render()},er);
  db.collection('log').orderBy('ts','desc').limit(60).onSnapshot(s=>{S.logs=s.docs.map(d=>({id:d.id,...d.data()}));render()},er);
};
setTimeout(()=>{if(!db)render()},8000);

function render(){
  const keep={};document.querySelectorAll('#app input,#app select').forEach(i=>{if(i.id)keep[i.id]=i.value});
  const fid=document.activeElement&&document.activeElement.id;
  const sy=window.scrollY;
  $('#app').innerHTML=view();
  for(const k in keep){if(k==='sq'||k==='sd')continue;const e=document.getElementById(k);if(e)e.value=keep[k]}
  if(fid){const e=document.getElementById(fid);if(e)e.focus()}
  window.scrollTo(0,sy);
}
function view(){
  if(!db)return `<div class="center"><h1>Inventario</h1><p class="mut">No se pudo conectar con la base de datos. Revisa tu conexión y recarga la página.</p></div>`;
  if(S.err)return `<div class="center"><p>${esc(S.err)}</p></div>`;
  if(!S.lu||!S.lp)return `<div class="center mut">Cargando…</div>`;
  if(!S.users.length)return setupView();
  if(!S.me)return loginView();
  return mainView();
}
function dots(){return `<div class="dots">${[0,1,2,3].map(i=>`<i class="${i<S.pin.length?'f':''}"></i>`).join('')}</div>`}
function pad(){return `<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')}<button onclick="S.pin='';render()">C</button><button onclick="key('0')">0</button><button onclick="S.pin=S.pin.slice(0,-1);render()">⌫</button></div>`}
function setupView(){return `<div class="center"><h1>Configuración inicial</h1><p class="mut">Crea la cuenta de administrador.</p>
<label>Tu nombre</label><input id="sn" placeholder="Nombre"><label>PIN de 4 dígitos</label><input id="sp" inputmode="numeric" maxlength="4" placeholder="0000">
<p><button onclick="setup()" style="width:100%">Crear administrador</button></p></div>`}
function loginView(){return `<div class="center"><h1>🍺 Inventario</h1><p class="mut">Introduce tu PIN</p>${dots()}${pad()}<p class="mut">${esc(S.msg||'')}</p></div>`}
function key(d){if(S.pin.length>=4)return;S.pin+=d;S.msg='';
  if(S.pin.length===4){const u=S.users.find(x=>x.pin===S.pin);S.pin='';if(u){st.set('inv_me',u.id);S.me=u;S.tab='inv'}else S.msg='PIN incorrecto'}
  render()}
async function setup(){const n=$('#sn').value.trim(),p=$('#sp').value.trim();
  if(!n||!/^\d{4}$/.test(p))return toast('Nombre y PIN de 4 dígitos');
  try{await db.collection('users').doc(uid()).set({name:n,pin:p,role:'admin'})}catch(e){toast('Error: '+e.message)}}
function logout(){st.del('inv_me');S.me=null;S.pin='';render()}

function mainView(){
  const t=S.tab;
  return `<div class="top"><div><h1>🍺 Inventario</h1><div class="mut">${esc(S.me.name)}${isAdmin()?' · admin':''}</div></div><button class="g" onclick="logout()">Salir</button></div>`+
  (t==='inv'?invView():t==='log'?logView():usersView())+
  `<div class="tabs"><button class="${t==='inv'?'on':''}" onclick="S.tab='inv';render()">📦 Stock</button><button class="${t==='log'?'on':''}" onclick="S.tab='log';render()">🕘 Historial</button>${isAdmin()?`<button class="${t==='usr'?'on':''}" onclick="S.tab='usr';render()">👥 Usuarios</button>`:''}</div>`+
  (S.sheet?sheetView():'');
}
function invView(){
  const low=S.products.filter(isLow);
  let list=S.products.filter(p=>(S.cat==='Todos'||p.cat===S.cat)&&(!S.low||isLow(p))&&p.name.toLowerCase().includes(S.q.toLowerCase()));
  list.sort((a,b)=>a.name.localeCompare(b.name,'es'));
  let h='';
  if(!S.products.length)h+=`<div class="card center"><p>El inventario está vacío.</p>${isAdmin()?`<button onclick="seed()">Cargar inventario inicial (${Object.values(SEED).flat().length} productos)</button><p class="mut">${esc(S.seeding)}</p>`:'<p class="mut">Pide al administrador que cargue los productos.</p>'}</div>`;
  if(low.length)h+=`<div class="alert" onclick="S.low=!S.low;render()">⚠️ ${low.length} producto${low.length>1?'s':''} con stock bajo ${S.low?'(mostrando solo esos · toca para ver todo)':'· toca para filtrar'}</div>`;
  h+=`<input id="q" placeholder="Buscar producto…" value="${esc(S.q)}" oninput="S.q=this.value;render()">`;
  h+=`<div class="chips">${['Todos',...CATS].map(c=>`<button class="${S.cat===c?'':'g'}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div>`;
  if(isAdmin())h+=`<button class="g" style="width:100%;margin-bottom:8px" onclick="openSheet('new')">＋ Nuevo producto</button>`;
  h+=list.map(p=>`<div class="card row ${isLow(p)?'low':''}"><div class="grow" onclick="openSheet('${p.id}')"><b>${esc(p.name)}</b><div class="mut">${esc(p.cat)}${p.min?` · mín. ${p.min}`:''}${p.lastEntry?` · pedido ${fd(p.lastEntry.date)}`:''}</div></div><button class="rb g" onclick="move('${p.id}',-1,'salida')">−</button><div class="qty">${p.qty||0}</div><button class="rb" onclick="openSheet('${p.id}','entrada')">+</button></div>`).join('');
  if(S.products.length&&!list.length)h+=`<p class="mut center">Sin resultados</p>`;
  return h;
}
function logView(){return S.logs.length?S.logs.map(l=>`<div class="card"><b>${esc(l.product)}</b> <span style="color:var(--${l.delta<0?'bad':'ok'})">${l.delta>0?'+':''}${l.delta}</span> <span class="mut">→ ${l.after}</span><div class="mut">${esc(l.user)} · ${new Date(l.ts).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}${l.type==='entrada'&&l.date?' · pedido del '+fd(l.date):''}</div></div>`).join(''):'<p class="mut center">Aún no hay movimientos</p>'}
function usersView(){return `<h2>Usuarios</h2>`+S.users.map(u=>`<div class="card row"><div class="grow"><b>${esc(u.name)}</b><div class="mut">${u.role==='admin'?'Administrador':'Empleado'} · PIN ${esc(u.pin)}</div></div>${u.id!==S.me.id?`<button class="g" onclick="delUser('${u.id}')">Borrar</button>`:'<span class="mut">tú</span>'}</div>`).join('')+
`<h2>Añadir usuario</h2><label>Nombre</label><input id="un" placeholder="Ej: Ernesto"><label>PIN de 4 dígitos (único)</label><input id="up" inputmode="numeric" maxlength="4"><label>Rol</label><select id="ur"><option value="staff">Empleado</option><option value="admin">Administrador</option></select><p><button style="width:100%" onclick="addUser()">Crear usuario</button></p>`}
async function addUser(){const n=$('#un').value.trim(),p=$('#up').value.trim(),r=$('#ur').value;
  if(!n||!/^\d{4}$/.test(p))return toast('Nombre y PIN de 4 dígitos');
  if(S.users.some(u=>u.pin===p))return toast('Ese PIN ya está en uso');
  try{await db.collection('users').doc(uid()).set({name:n,pin:p,role:r});$('#un').value='';$('#up').value='';toast('Usuario creado')}catch(e){toast('Error: '+e.message)}}
async function delUser(id){const u=S.users.find(x=>x.id===id);if(!u||!confirm('¿Borrar a '+u.name+'?'))return;
  if(u.role==='admin'&&S.users.filter(x=>x.role==='admin').length<2)return toast('Debe quedar un admin');
  try{await db.collection('users').doc(id).delete()}catch(e){toast('Error: '+e.message)}}

function openSheet(id,mode){const p=id==='new'?{name:'',cat:CATS[0],min:0,qty:0}:S.products.find(x=>x.id===id);if(!p)return;
  S.sheet={id,mode:mode||'salida',n:1,date:today()};S.edit=id==='new';render()}
function closeSheet(){S.sheet=null;S.edit=false;render()}
function sheetView(){const sh=S.sheet,isNew=sh.id==='new',p=isNew?{name:'',cat:CATS[0],min:0,qty:0}:S.products.find(x=>x.id===sh.id);if(!p){S.sheet=null;return''}
  let h=`<div class="sheet" onclick="if(event.target===this)closeSheet()"><div>`;
  if(!isNew)h+=`<div class="row"><div class="grow"><h1>${esc(p.name)}</h1><div class="mut">Stock actual: <b>${p.qty||0}</b>${p.lastEntry?` · último pedido ${fd(p.lastEntry.date)} (+${p.lastEntry.qty})`:''}</div></div><button class="g" onclick="closeSheet()">✕</button></div>
  <div class="seg"><button class="${sh.mode==='salida'?'':'g'}" onclick="S.sheet.mode='salida';render()">Salida (−)</button><button class="${sh.mode==='entrada'?'':'g'}" onclick="S.sheet.mode='entrada';render()">Entrada (+)</button></div>
  <label>Cantidad</label><div class="row"><button class="rb g" onclick="S.sheet.n=Math.max(1,S.sheet.n-1);render()">−</button><input id="sq" type="number" min="1" value="${sh.n}" style="text-align:center" oninput="S.sheet.n=Math.max(1,parseInt(this.value)||1)"><button class="rb g" onclick="S.sheet.n++;render()">+</button></div>
  ${sh.mode==='entrada'?`<label>Fecha de entrada del pedido</label><input id="sd" type="date" value="${sh.date}" oninput="S.sheet.date=this.value">`:''}
  <p><button style="width:100%" onclick="confirmMove()">Confirmar ${sh.mode==='entrada'?'entrada':'salida'}</button></p>`;
  if(isAdmin()){
    if(!isNew&&!S.edit)h+=`<button class="g" style="width:100%" onclick="S.edit=true;render()">✏️ Editar producto / stock mínimo</button>`;
    if(S.edit)h+=`<h2>${isNew?'Nuevo producto':'Editar producto'}</h2><label>Nombre</label><input id="en" value="${esc(p.name)}"><label>Categoría</label><select id="ec">${CATS.map(c=>`<option ${c===p.cat?'selected':''}>${c}</option>`).join('')}</select><label>Stock mínimo (alerta)</label><input id="em" type="number" min="0" value="${p.min||0}">${isNew?`<label>Stock inicial</label><input id="ei" type="number" min="0" value="0">`:''}
    <p class="row"><button class="grow" onclick="saveProd()">Guardar</button>${isNew?'':`<button class="r" onclick="delProd()">Borrar</button>`}</p>`;
  }
  return h+`</div></div>`}
async function move(id,delta,type,date){
  try{const ref=db.collection('products').doc(id);const p=(await ref.get()).data();if(!p)return;
    const old=p.qty||0,nq=Math.max(0,old+delta);const up={qty:nq};if(type==='entrada')up.lastEntry={date,qty:delta};
    await ref.update(up);
    await db.collection('log').doc(uid()).set({ts:Date.now(),user:S.me.name,product:p.name,delta:nq-old,type,date:date||null,after:nq});
    if(nq<=(p.min||0)&&p.min>0)toast('⚠️ Stock bajo: '+p.name)}catch(e){toast('Error: '+e.message)}}
async function confirmMove(){const sh=S.sheet;const e=sh.mode==='entrada';await move(sh.id,e?sh.n:-sh.n,sh.mode,sh.date);closeSheet()}
async function saveProd(){const n=$('#en').value.trim(),c=$('#ec').value,m=Math.max(0,parseInt($('#em').value)||0);if(!n)return toast('Pon un nombre');
  try{if(S.sheet.id==='new'){const q=Math.max(0,parseInt($('#ei').value)||0);await db.collection('products').doc(uid()).set({name:n,cat:c,min:m,qty:q})}
  else await db.collection('products').doc(S.sheet.id).update({name:n,cat:c,min:m});closeSheet()}catch(e){toast('Error: '+e.message)}}
async function delProd(){const p=S.products.find(x=>x.id===S.sheet.id);if(!confirm('¿Borrar '+p.name+'?'))return;
  try{await db.collection('products').doc(p.id).delete();closeSheet()}catch(e){toast('Error: '+e.message)}}
async function seed(){let i=0;const have=new Set(S.products.map(p=>p.id));const all=[];
  for(const c in SEED)SEED[c].forEach(n=>all.push([c,n]));
  try{for(const [c,n] of all){i++;const id='p'+String(i).padStart(3,'0');if(have.has(id))continue;
    await db.collection('products').doc(id).set({name:n,cat:c,min:0,qty:0});S.seeding=`Cargando ${i}/${all.length}…`;if(i%10===0)render();await new Promise(r=>setTimeout(r,80))}
    S.seeding='';toast('Inventario cargado')}catch(e){S.seeding='Se detuvo: '+e.message+'. Pulsa de nuevo para continuar.';render()}}
</script><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBN07nTEv5OBktxqathbOXJjAupjwL1Isw",authDomain:"garbes-1f1c8.firebaseapp.com",projectId:"garbes-1f1c8",storageBucket:"garbes-1f1c8.firebasestorage.app",messagingSenderId:"695595442015",appId:"1:695595442015:web:836353eefe08ae9f29a0ea"};
const fs=getFirestore(initializeApp(cfg));
const mk=(n,q)=>({orderBy:(f,d)=>mk(n,[...q,orderBy(f,d)]),limit:k=>mk(n,[...q,limit(k)]),onSnapshot:(ok,er)=>onSnapshot(query(collection(fs,n),...q),ok,er),doc:id=>{const r=doc(fs,n,id);return{get:()=>getDoc(r),set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r)}}});
window.boot({collection:n=>mk(n,[])});
</script>
</body></html>
